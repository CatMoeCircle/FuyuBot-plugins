      linux-x86_64: epic-0.1.1-linux-x86_64.zip
      macos-aarch64: epic-0.1.1-macos-aarch64.zip
      android-aarch64: epic-0.1.1-android-aarch64.zip
      android-x86_64: epic-0.1.1-android-x86_64.zip

  # 0.1.3：ABI 6
