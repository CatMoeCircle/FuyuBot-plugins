id: epic
name: Epic
summary: 生成 Epic 免费游戏卡片并以照片回复消息。
description: |
  抓取 Epic 游戏商城当前的免费游戏列表，把本期免费作品渲染成信息卡片，
  以照片回复触发消息。支持 Windows、Linux、macOS 与 Android AArch64/x86_64。
repo: fengyegf/fy-plugins
homepage: https://github.com/fengyegf/fy-plugins
tags: [epic, game, card]
abi: 6
depends: []
