      macos-aarch64: fuyubot.help-0.1.1-macos-aarch64.zip
      linux-aarch64: fuyubot.help-0.1.1-linux-aarch64.zip
      android-aarch64: fuyubot.help-0.1.1-android-aarch64.zip
      android-x86_64: fuyubot.help-0.1.1-android-x86_64.zip

