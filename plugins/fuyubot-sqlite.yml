id: fuyubot.sqlite
name: SQLite Storage
summary: 给其它插件提供进程级 SQLite：参数化查询、表结构模板、事务批量写入，按插件隔离库文件。
description: |
  注册 `fuyubot.sqlite` 服务，所有方法 JSON 进、JSON 出：
  info / migrate / templates / execute / query / batch / tables。
  值一律走参数绑定，SQL 文本里只有占位符；SQLite 以 bundled 方式编入，运行时不依赖系统库。
  默认 per_plugin 模式（每个调用方插件一个库文件），也可以切成 shared 共用一份，
  模板表会自动加调用方前缀。
repo: xiaoqvan/fuyubot-plugins
license: MIT OR Apache-2.0
homepage: https://github.com/xiaoqvan/fuyubot-plugins/tree/main/crates/fuyubot-plugin-sqlite
tags: [sqlite, storage, database]
api: ">=0.1, <1.0"
abi: 6
depends: []
