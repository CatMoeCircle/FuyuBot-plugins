id: xiaoqvan.x
name: X 解析
summary: X / Twitter 解析：图片视频按 Telegram 相册发送，纯文本出 X 风格卡片。
description: |
  X / Twitter 文章解析：/x 命令与聊天里的链接都会解析。
  图片、视频按 Telegram 相册每 10 个一组发送；纯文本文章交给 fuyubot.html2img
  出 X 风格卡片（详情页版式、原文与谷歌翻译对照、底部 bot 与插件署名），没装
  html2img 就发纯文本。
  有媒体时卡片最多预览两张，视频只画封面，GIF 带角标；非中文帖子会尝试谷歌机翻。
  解析走 FxTwitter / FxEmbed 公开只读接口，不需要 token。
