id: fengyegf.epic
name: Epic
summary: 生成 Epic 免费游戏卡片并以照片回复消息。
description: |
  抓取 Epic 游戏商城当前的免费游戏列表，把本期免费作品整理成信息卡片，
  交给宿主上的 fuyubot.html2img 渲染后再以照片回复触发消息。支持 Windows、
  Linux、macOS 与 Android AArch64/x86_64。
repo: fengyegf/fy-plugins
homepage: https://github.com/fengyegf/fy-plugins/tree/main/crates/fuyubot-plugin-epic
tags: [epic, game, card]
abi: 6
depends: [fuyubot.html2img]
versions:
  # 0.1.6：ABI 6，资产按 fengyegf.<id> 命名（Linux 包按 glibc 2.28 构建）
  - version: 0.1.6
    tag: fengyegf.epic-v0.1.6
    assets:
      windows-x86_64: fengyegf.epic-0.1.6-windows-x86_64.zip
      linux-x86_64: fengyegf.epic-0.1.6-linux-x86_64.zip
      macos-aarch64: fengyegf.epic-0.1.6-macos-aarch64.zip
      android-aarch64: fengyegf.epic-0.1.6-android-aarch64.zip
      android-x86_64: fengyegf.epic-0.1.6-android-x86_64.zip
