id: xiaoqvan.adblock
name: Adblock
summary: 广告拦截：关键词 / 文件 / 贴纸 / 转发来源 / AI 审核，命中即删除、禁言或封禁；自动点赞机器人默认只封禁回应权限（可跟随广告）；可删入群提示、取消频道置顶；可用 chat_allowlist 限定只在指定群生效。
description: |
  一条消息进来，按关键词、文件、贴纸、转发来源、用户名、资料逐项匹配；命中就撤回消息、
  禁言或封禁，并把处置记录写进群绑定的日志频道。没命中的可疑消息（引用、联系人、
  带全局触发词、入群 24h 内改过资料的人）再送 AI 深度审核，判定为广告后自动把关键词 /
  全文 / 名称 / 简介 / 转发来源 / 贴纸集写回黑名单。
  0.1.7：插件 id 从 fuyubot.adblock 迁移为 xiaoqvan.adblock；新增 chat_allowlist（只在这些群
  生效，不在列表的群完全跳过）；群自定义 AI 接口失败时不再回退到内置备用模型，并私聊通知
  配置人；新增自定义 emoji 广告检测。
  另外按群开关可删除三种入群提示（成员加入 / 社区加入 / 邀请链接），并自动取消群绑定频道帖子被
  Telegram 自动置顶的置顶；点赞机器人默认只封禁回应权限（仍可正常发言），群内可切换为跟随广告
  的禁言 / 封禁，并清掉它已点出去的回应。
  数据全部存在 MongoDB（依赖 fuyubot.mongo），插件启动时自动建集合与索引。
  主人 / 管理员不再由插件自己配：用宿主 fuyubot.toml 的 [roles].owners / [roles].admins。
repo: xiaoqvan/fuyubot-plugins
license: MIT OR Apache-2.0
homepage: https://github.com/xiaoqvan/fuyubot-plugins/tree/main/crates/fuyubot-plugin-adblock
tags: [moderation, antispam, telegram, ai]
api: ">=0.1.5, <1.0"
abi: 6
depends: [fuyubot.mongo]
versions:
  # 0.1.7：新 id 的第一版（老 id fuyubot.adblock 条目保留，老用户仍可安装/回滚旧版）。
