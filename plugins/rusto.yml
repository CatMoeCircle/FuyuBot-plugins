id: rusto
name: RustO OCR
summary: 纯 Rust OCR：发图 /ocr 识别文字，并以 rusto.ocr 服务供其它插件调用。
description: |
  基于 RustO!（PP-OCRv6 Tiny INT8，纯 Rust MNN 运行时）的图片文字识别：回复图片
  发 /ocr 出文本，支持详细模式、引擎状态与模型预热；内置模型随包分发，不依赖
  Python / OpenCV / ONNX Runtime，同时以进程级服务 rusto.ocr 供宿主与其它插件调用。
  支持 Windows、Linux、macOS 与 Android AArch64/x86_64。
repo: fengyegf/fy-plugins
homepage: https://github.com/fengyegf/fy-plugins/tree/main/crates/fuyubot-plugin-rusto
tags: [ocr, image, text, service]
abi: 6
depends: []
versions:
  # 0.1.0：首版，ABI 6（RustO! PP-OCRv6 Tiny INT8 内置模型，提供 rusto.ocr 服务）
  - version: 0.1.0
    tag: rusto-v0.1.0
    assets:
      windows-x86_64: rusto-0.1.0-windows-x86_64.zip
      linux-x86_64: rusto-0.1.0-linux-x86_64.zip
      macos-aarch64: rusto-0.1.0-macos-aarch64.zip
      android-aarch64: rusto-0.1.0-android-aarch64.zip
      android-x86_64: rusto-0.1.0-android-x86_64.zip

  # 0.1.1：当前最新，ABI 6（plugin.json + bin/ 布局，随包 config.default.toml，Release 带构建证明）
  - version: 0.1.1
    tag: rusto-v0.1.1
    assets:
      windows-x86_64: rusto-0.1.1-windows-x86_64.zip
      linux-x86_64: rusto-0.1.1-linux-x86_64.zip
      macos-aarch64: rusto-0.1.1-macos-aarch64.zip
      android-aarch64: rusto-0.1.1-android-aarch64.zip
      android-x86_64: rusto-0.1.1-android-x86_64.zip
