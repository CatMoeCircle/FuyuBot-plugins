id: fengyegf.rusto
name: RustO OCR
summary: 纯 Rust OCR：发图 /ocr 识别文字，并以 rusto.ocr 服务供其它插件调用。
description: |
  基于 RustO!（PP-OCRv6 Tiny INT8，纯 Rust MNN 运行时）的图片文字识别：回复图片
  发 /ocr 出文本，支持详细模式、引擎状态与模型预热；内置模型随包分发，不依赖
  Python / OpenCV / ONNX Runtime，同时以进程级服务 rusto.ocr 供宿主与其它插件调用。
  支持 Windows、Linux 与 macOS（0.1.5 起不再支持 Android）。
repo: fengyegf/fy-plugins
homepage: https://github.com/fengyegf/fy-plugins/tree/main/crates/fuyubot-plugin-rusto
tags: [ocr, image, text, service]
abi: 6
depends: []
versions:
  # 0.1.3：ABI 6，资产按 fengyegf.<id> 命名（Linux 包按 glibc 2.28 构建）
  - version: 0.1.3
    tag: fengyegf.rusto-v0.1.3
    assets:
      windows-x86_64: fengyegf.rusto-0.1.3-windows-x86_64.zip
      linux-x86_64: fengyegf.rusto-0.1.3-linux-x86_64.zip
      macos-aarch64: fengyegf.rusto-0.1.3-macos-aarch64.zip
      android-aarch64: fengyegf.rusto-0.1.3-android-aarch64.zip
      android-x86_64: fengyegf.rusto-0.1.3-android-x86_64.zip

  # 0.1.4：ABI 6，安卓从插件目录找随包模型，缺下载器时直报手动放置
  - version: 0.1.4
    tag: fengyegf.rusto-v0.1.4
    assets:
      windows-x86_64: fengyegf.rusto-0.1.4-windows-x86_64.zip
      linux-x86_64: fengyegf.rusto-0.1.4-linux-x86_64.zip
      macos-aarch64: fengyegf.rusto-0.1.4-macos-aarch64.zip
