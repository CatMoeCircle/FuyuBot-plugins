id: fuyubot.mongo
name: MongoDB Storage
summary: 给任意插件提供 storage.mongo：集合级 JSON CRUD、聚合与索引管理。
description: |
  注册 `storage.mongo` 服务，把 MongoDB 的常用操作包成统一 JSON 方法：
  ping / find / find_one / insert / update / delete / count / aggregate / distinct /
  ensure_index / collections / configure。
  不认识任何业务表，集合名与过滤条件全部由调用方给；连接失败不拦启动，库恢复后自动重连。
  业务插件也可以用 `configure` 下发连接串与库名。
repo: xiaoqvan/fuyubot-plugins
license: MIT OR Apache-2.0
homepage: https://github.com/xiaoqvan/fuyubot-plugins
tags: [mongodb, storage, database]
api: ">=0.1, <1.0"
abi: 5
depends: []
