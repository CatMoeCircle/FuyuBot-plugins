id: image-plugin
name: Image Render
summary: 注册 image.render：把 HTML 或「模板 + 数据」渲染成 JPEG/PNG。
description: |
  一个插件搞定 HTML 出图：模板、数据、尺寸全由调用方给，插件不含任何业务字段。
  渲染器以独立进程运行（Ultralight 要求主线程），崩了只崩一张图；服务方法 render / ping。
  部署时把 Ultralight 运行时放到 plugin 目录或 image-shot 同级即可。
repo: xiaoqvan/fuyubot-plugin-image
license: MIT OR Apache-2.0
homepage: https://github.com/xiaoqvan/fuyubot-plugin-image
tags: [image, html, render]
api: ">=0.1, <1.0"
abi: 5
depends: []
versions:
  - version: 0.1.0
    tag: v0.1.0
    assets:
      windows-x86_64: image-plugin-0.1.0-windows-x86_64.zip
      linux-x86_64: image-plugin-0.1.0-linux-x86_64.zip
      macos-aarch64: image-plugin-0.1.0-macos-aarch64.zip
