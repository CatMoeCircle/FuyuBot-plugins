id: fengyegf.whois
name: Whois
summary: 查询域名 Whois 信息，渲染成信息卡片并以照片回复。
description: |
  支持裸域名、完整 URL、端口、路径与中文域名，展示注册商、注册与到期时间、
  域名状态、DNS 服务器以及服务器 IP 归属；信息卡片由宿主上的 fuyubot.html2img
  渲染成 JPEG，以照片回复触发消息。支持 Windows、Linux、macOS 与 Android
  AArch64/x86_64。
repo: fengyegf/fy-plugins
homepage: https://github.com/fengyegf/fy-plugins/tree/main/crates/fuyubot-plugin-whois
tags: [whois, domain, card]
abi: 6
depends: [fuyubot.html2img]
versions:
  # 0.1.6：ABI 6，资产按 fengyegf.<id> 命名（Linux 包按 glibc 2.28 构建）
  - version: 0.1.6
    tag: fengyegf.whois-v0.1.6
    assets:
      windows-x86_64: fengyegf.whois-0.1.6-windows-x86_64.zip
      linux-x86_64: fengyegf.whois-0.1.6-linux-x86_64.zip
      macos-aarch64: fengyegf.whois-0.1.6-macos-aarch64.zip
      android-aarch64: fengyegf.whois-0.1.6-android-aarch64.zip
      android-x86_64: fengyegf.whois-0.1.6-android-x86_64.zip
