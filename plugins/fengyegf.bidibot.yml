      macos-aarch64: fengyegf.bidibot-0.1.2-macos-aarch64.zip
      android-aarch64: fengyegf.bidibot-0.1.2-android-aarch64.zip
      android-x86_64: fengyegf.bidibot-0.1.2-android-x86_64.zip
